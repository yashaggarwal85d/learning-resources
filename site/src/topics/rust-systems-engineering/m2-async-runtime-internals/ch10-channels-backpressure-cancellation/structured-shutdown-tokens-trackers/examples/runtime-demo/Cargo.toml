[package]
name = "runtime-demo"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "shutdown_rejects_new_after_signal"
path = "src/shutdown_rejects_new_after_signal.rs"

[[bin]]
name = "tracker_waits_for_every_accepted_job"
path = "src/tracker_waits_for_every_accepted_job.rs"

[[bin]]
name = "shutdown_meets_its_deadline"
path = "src/shutdown_meets_its_deadline.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "rt", "time", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
