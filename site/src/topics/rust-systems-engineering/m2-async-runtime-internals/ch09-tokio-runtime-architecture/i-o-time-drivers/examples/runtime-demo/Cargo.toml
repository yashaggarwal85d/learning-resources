[package]
name = "runtime-demo"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mio_register_then_connect"
path = "src/mio_register_then_connect.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "rt", "time", "sync", "macros"] }
mio = { version = "1", features = ["os-poll", "net"] }

[[bin]]
name = "mio_poll_times_out_with_nothing_ready"
path = "src/mio_poll_times_out_with_nothing_ready.rs"

[[bin]]
name = "sleep_actually_wakes_at_deadline"
path = "src/sleep_actually_wakes_at_deadline.rs"
