[package]
name = "span_demo"
version = "0.1.0"
edition = "2024"

[lib]
name = "span_demo"
path = "src/lib.rs"

[[bin]]
name = "bad_enter"
path = "src/bad_enter.rs"

[[bin]]
name = "fixed_instrument"
path = "src/fixed_instrument.rs"

[[bin]]
name = "fixed_macro"
path = "src/fixed_macro.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
