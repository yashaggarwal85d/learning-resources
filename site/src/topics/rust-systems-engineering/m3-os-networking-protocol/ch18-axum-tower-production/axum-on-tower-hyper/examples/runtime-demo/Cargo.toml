[package]
name = "runtime-demo"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "axum_is_tower_underneath"
path = "src/axum_is_tower_underneath.rs"

[dependencies]
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["timeout"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
