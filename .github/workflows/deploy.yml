name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'syllabus/*.md'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.site.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: site
        run: |
          if [ -f site/package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::There is no site/ folder yet, so there is nothing to deploy."
          fi

  build:
    needs: check
    if: needs.check.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reels this change can affect
        id: affected
        working-directory: .
        run: |
          A=$(node scripts/affected.mjs "${{ github.event.before }}")
          echo "$A"
          echo "reels=$(node -e 'const a=JSON.parse(process.argv[1]); console.log(a.all ? "" : (a.slugs.join(",") || "none"))' "$A")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run every topic's code examples
        run: npm run test:examples
      - name: Narration matches every live reel's script
        run: npm run test:narration
      - name: Install Chromium for the reel smoke test
        run: npx playwright install --with-deps chromium
      - name: Reel smoke test (desktop and phone)
        run: |
          npx astro preview --host 127.0.0.1 --port 4321 > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4321/learning-resources/ > /dev/null && break; sleep 1; done
          npm run test:reels -- http://127.0.0.1:4321/learning-resources/ ${{ steps.affected.outputs.reels }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-screenshots
          path: site/test-results
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
