name: Deploy site to GitHub Pages
# Owner decision 2026-10-22 (after the canary fix still wasn't fast enough): Deploy no longer re-runs the reel,
# narration and editor tests itself. ci.yml already runs the same tests on every push to main and is never
# cancelled there (see its concurrency group), so it's a reliable gate on its own; Deploy re-testing was redundant
# work, and at ~15-20 minutes it kept losing the race to the next routine push under `concurrency: pages`
# (cancel-in-progress), so the live site could go hours without actually publishing. Deploy now just builds and
# publishes (~2-3 minutes); a bad build can be briefly live until CI flags it, fixed forward like any other
# CI-red commit, never by skipping or loosening a check.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'syllabus/*.md'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.site.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: site
        run: |
          if [ -f site/package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::There is no site/ folder yet, so there is nothing to deploy."
          fi

  build:
    needs: check
    if: needs.check.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
