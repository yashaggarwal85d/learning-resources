name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-docs.mjs

  site:
    name: Site build and reel tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No site yet
        if: hashFiles('site/package-lock.json') == ''
        run: echo "::notice::There is no site/ folder yet, so there is nothing to build."
      - uses: actions/setup-node@v4
        if: hashFiles('site/package-lock.json') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: npm ci
      - if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: npm run build
      - name: Run every topic's code examples
        if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: npm run test:examples
      - name: Install Chromium for the reel smoke test
        if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Reel smoke test (desktop and phone)
        if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: |
          npx astro preview --host 127.0.0.1 --port 4321 > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4321/learning-resources/ > /dev/null && break; sleep 1; done
          npm run test:reels -- http://127.0.0.1:4321/learning-resources/
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('site/package-lock.json') != ''
        with:
          name: reel-screenshots
          path: site/test-results
          if-no-files-found: ignore
