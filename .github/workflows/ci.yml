name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A push or PR tests only the reels it can affect (scripts/affected.mjs): a fixed canary when shared code changed,
  # so this stays fast as topics grow. The true full sweep is a separate workflow (full-sweep.yml, daily and on demand).

permissions:
  contents: read

# On main every push is checked to the end (routine runs confirm their own merge); elsewhere a newer push replaces an older run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-docs.mjs

  site:
    name: Site build and reel tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reels this change can affect
        id: affected
        run: |
          BASE="${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}"
          A=$(node scripts/affected.mjs "$BASE")
          echo "$A"
          echo "reels=$(node -e 'const a=JSON.parse(process.argv[1]); console.log(a.all ? a.canary.join(",") : (a.slugs.join(",") || "none"))' "$A")" >> "$GITHUB_OUTPUT"
      - name: Live reels are locked
        run: node scripts/check-locked.mjs "${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}"
      - name: No site yet
        if: hashFiles('site/package-lock.json') == ''
        run: echo "::notice::There is no site/ folder yet, so there is nothing to build."
      - uses: actions/setup-node@v4
        if: hashFiles('site/package-lock.json') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: npm ci
      - if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: npm run build
      - name: Narration matches every live reel's script
        if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: npm run test:narration
      - name: Install Chromium for the reel smoke test
        if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Reel smoke test (desktop and phone)
        if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: |
          # Held topics (finished, waiting for earlier ones) are tested too, on a test-only build that gives them pages.
          export PREVIEW_HELD=1
          npm run build > /dev/null
          npx astro preview --host 127.0.0.1 --port 4321 > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4321/learning-resources/ > /dev/null && break; sleep 1; done
          npm run test:reels -- http://127.0.0.1:4321/learning-resources/ ${{ steps.affected.outputs.reels }}
          npm run test:editor -- http://127.0.0.1:4321/learning-resources/
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('site/package-lock.json') != ''
        with:
          name: reel-screenshots
          path: site/test-results
          if-no-files-found: ignore
